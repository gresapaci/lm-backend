<!doctype html>
<html lang="en">
<head>

  <title>To-Do App — Starter</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", Arial, sans-serif; background: #f1f5f9; display: flex; justify-content: center; padding: 40px 16px; margin: 0; }
    .app { background: #fff; width: 100%; max-width: 480px; border-radius: 12px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
    h1 { margin-top: 0; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    button { padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; cursor: pointer; font-size: 15px; }
    ul { list-style: none; padding: 0; margin: 20px 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
    li.done span { text-decoration: line-through; color: #94a3b8; }
    li span { flex: 1; }
    li .delete { background: #ef4444; padding: 4px 10px; font-size: 13px; }
    .filters { display: flex; gap: 6px; }
    .filters button { background: #e2e8f0; color: #1f2937; }
    .filters button.active { background: #1f2937; color: #fff; }
    .footer { display: flex; justify-content: space-between; align-items: center; color: #64748b; font-size: 14px; }
  </style>
</head>
