<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Segoe UI, Arial, sans-serif">
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
  <rect width="900" height="360" fill="#ffffff"/>
  <text x="450" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#1f2937">Promise Lifecycle</text>
  <rect x="60" y="140" width="200" height="70" rx="35" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="160" y="182" text-anchor="middle" font-size="20" font-weight="700">pending</text>
  <rect x="560" y="70" width="260" height="70" rx="35" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="690" y="112" text-anchor="middle" font-size="20" font-weight="700" fill="#14532d">fulfilled (value)</text>
  <rect x="560" y="210" width="260" height="70" rx="35" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="690" y="252" text-anchor="middle" font-size="20" font-weight="700" fill="#7f1d1d">rejected (reason)</text>
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)"><line x1="262" y1="165" x2="556" y2="110"/><line x1="262" y1="185" x2="556" y2="245"/></g>
  <text x="400" y="118" text-anchor="middle" font-size="16">resolve(value)</text>
  <text x="400" y="248" text-anchor="middle" font-size="16">reject(error)</text>
  <text x="450" y="320" text-anchor="middle" font-size="16" fill="#1f2937">.then() handles fulfilled · .catch() handles rejected · .finally() runs for both</text>
  <text x="450" y="345" text-anchor="middle" font-size="15" fill="#475569">A settled promise never changes state again.</text>
</svg>
