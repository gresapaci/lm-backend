    <line x1="530" y1="325" x2="530" y2="370"/><line x1="770" y1="325" x2="770" y2="370"/>
  </g>
  <g font-size="17" text-anchor="middle">
    <rect x="370" y="60" width="160" height="35" rx="8" fill="#1f2937"/><text x="450" y="84" fill="#fff">document</text>
    <rect x="390" y="130" width="120" height="35" rx="8" fill="#f97316"/><text x="450" y="154" fill="#fff">&lt;html&gt;</text>
