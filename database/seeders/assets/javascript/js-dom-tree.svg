    <line x1="450" y1="95" x2="450" y2="130"/>
    <line x1="450" y1="165" x2="250" y2="210"/><line x1="450" y1="165" x2="650" y2="210"/>
    <line x1="250" y1="245" x2="250" y2="290"/>
